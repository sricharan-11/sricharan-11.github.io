        /* ── Design tokens (matching main site) ── */
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --card-bg: #1e293b;
            --border-color: #334155;
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Password Overlay ── */
        #password-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #password-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .lock-container {
            text-align: center;
            max-width: 440px;
            width: 90%;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lock-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(56, 189, 248, 0.05));
            border: 2px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 2rem;
            color: var(--accent-color);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.25);
            }

            50% {
                box-shadow: 0 0 0 12px rgba(56, 189, 248, 0);
            }
        }

        .lock-container h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .lock-container p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .password-field {
            position: relative;
            margin-bottom: 1rem;
        }

        .password-field input {
            width: 100%;
            padding: 1rem 3rem 1rem 1.2rem;
            background: var(--sidebar-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .password-field input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .password-field input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent-color);
        }

        .unlock-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.3s ease;
            letter-spacing: 0.5px;
        }

        .unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(56, 189, 248, 0.4);
        }

        .unlock-btn:active {
            transform: translateY(0);
        }

        .unlock-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            min-height: 1.2em;
            transition: opacity 0.3s;
        }

        .error-msg.shake {
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        /* ── Decrypted Content Area ── */
        #content-area {
            display: none;
            max-width: 720px;
            width: 90%;
            margin: 3rem auto;
            padding: 3rem;
            animation: contentReveal 0.8s ease forwards;
        }

        @keyframes contentReveal {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .letter-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .letter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color), #a78bfa, #f472b6);
        }

        /* ── Letter Styling ── */
        .letter-header {
            margin-bottom: 2rem;
        }

        .letter-to {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .letter-body p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 1.2rem;
            line-height: 1.8;
        }

        .letter-body strong {
            color: var(--text-primary);
        }

        .highlight-block {
            background: rgba(56, 189, 248, 0.06);
            border-left: 3px solid var(--accent-color);
            padding: 1.5rem 1.5rem 0.5rem;
            border-radius: 0 10px 10px 0;
            margin: 1.5rem 0;
        }

        .note-block {
            background: rgba(167, 139, 250, 0.06);
            border-left: 3px solid #a78bfa;
            padding: 1.5rem 1.5rem 0.5rem;
            border-radius: 0 10px 10px 0;
            margin: 1.5rem 0;
        }

        .profile-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed var(--accent-color);
            transition: border-color 0.2s;
        }

        .profile-link:hover {
            border-bottom-style: solid;
        }

        .side-note {
            font-style: italic;
            color: var(--text-secondary) !important;
            opacity: 0.85;
        }

        .letter-footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .letter-footer p {
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
        }

        .signature {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-color) !important;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .letter-card {
                padding: 2rem 1.5rem;
            }

            #content-area {
                padding: 1.5rem;
            }

            .lock-container h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

            const errorEl = document.getElementById('error-msg');
            const unlockBtn = document.getElementById('unlock-btn');
            const toggleBtn = document.getElementById('toggle-password');
            const content = document.getElementById('content-area');
            const letterEl = document.getElementById('letter-card');

            // ── Toggle password visibility ──
            toggleBtn.addEventListener('click', () => {
                const showing = input.type === 'text';
                input.type = showing ? 'password' : 'text';
                toggleBtn.querySelector('i').classList.toggle('fa-eye', showing);
                toggleBtn.querySelector('i').classList.toggle('fa-eye-slash', !showing);

            // ── Helpers ──
            const b64ToUint8 = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

            async function deriveKey(password, salt) {
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
                );

                const ct = b64ToUint8(EP.ciphertext);
